# DayanVPN Panel - nginx with per-client routing generated by bot.py
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log main;
    log_format main '$remote_addr "$request" $status $body_bytes_sent';
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 8m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # blocked clients (bot writes these includes)
    map $uri $is_blocked {
        include /etc/nginx/gen/blocked.map;
        default 0;
    }
    map $uri $ws_port {
        include /etc/nginx/gen/ports.map;
        default 0;
    }
    map $uri $xh_port {
        include /etc/nginx/gen/xports.map;
        default 0;
    }

    server {
        listen 8080;
        server_name _;

        # --- per-client WebSocket ---
        location ~ "^/u/[a-z0-9]{6}$" {
            if ($is_blocked) { return 403; }
            if ($ws_port = 0) { return 404; }
            proxy_pass http://127.0.0.1:$ws_port;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # --- per-client XHTTP ---
        location ~ "^/x/[a-z0-9]{6}$" {
            if ($is_blocked) { return 403; }
            if ($xh_port = 0) { return 404; }
            proxy_pass http://127.0.0.1:$xh_port;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # --- per-client subscription ---
        location ~ "^/sub/[a-z0-9]{6}$" {
            if ($is_blocked) { return 403; }
            root /usr/share/nginx/html;
            default_type text/plain;
        }

        # --- landing page ---
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }
}
