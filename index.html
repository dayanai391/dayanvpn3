<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DayanVPN</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, sans-serif;
    background: radial-gradient(900px 500px at 30% -10%, #1a2550 0%, #0b1020 60%);
    color: #e8eeff; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: linear-gradient(180deg, #121a33, #0e1530);
    border: 1px solid #1e2a4f; border-radius: 20px;
    padding: 34px 28px; max-width: 420px; width: 100%;
    text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  .logo {
    width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 14px;
    background: linear-gradient(135deg, #4f8cff, #7c5cff);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 800; color: #fff;
  }
  h1 { font-size: 24px; margin-bottom: 6px; }
  p { color: #8b97b8; font-size: 14px; line-height: 2; }
  .box {
    background: #0a0f22; border: 1px solid #1e2a4f; border-radius: 12px;
    padding: 14px; margin: 18px 0; font-size: 14px; line-height: 2.2;
    color: #b9c7f0;
  }
  .tg { color: #60a5fa; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">D</div>
  <h1>DayanVPN</h1>
  <p>سرعت بالا · بدون قطعی · پشتیبانی سریع</p>
  <div class="box">
    🔑 لینک اشتراک اختصاصی داری؟<br>
    از ادمین بگیر و توی اپ وی‌پی‌ان وارد کن.
  </div>
  <p>برای خرید یا پشتیبانی با ادمین در تماس باش 👇</p>
  <div class="box tg">
    📩 پیام بدید به ادمین<br>
    ربات پنل DayanVPN
  </div>
  <p style="font-size:12px;color:#5b678a">© DayanVPN</p>
</div>
</body>
</html>
